
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>THESIS AI — Private Intelligence</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #111821;
      --line: #263341;
      --text: #ecf4f2;
      --muted: #8a9aab;
      --accent: #76f1c1;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    header {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 800; letter-spacing: 2px; }
    .brand span { color: var(--accent); }
    .status { color: var(--muted); font-size: 12px; }
    .status::before { content: "● "; color: var(--accent); }
    main {
      max-width: 850px;
      margin: auto;
      height: calc(100dvh - 70px);
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .welcome { text-align: center; margin: auto 0; }
    .welcome .symbol { font-size: 48px; color: var(--accent); }
    h1 { font-size: 30px; margin-bottom: 8px; }
    .welcome p { color: var(--muted); line-height: 1.6; }
    .message {
      max-width: 88%;
      padding: 14px 17px;
      border-radius: 17px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user {
      align-self: flex-end;
      background: #1b3a35;
      border: 1px solid #315a4c;
    }
    .assistant {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 13px;
      color: white;
      background: var(--panel);
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .send {
      height: 48px;
      width: 48px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #091713;
      font-weight: 800;
      font-size: 22px;
    }
    .send:disabled { opacity: .4; }
    .overlay {
      position: fixed;
      inset: 0;
      background: #0b0f14;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login h2 { margin: 12px 0; }
    .login p { color: var(--muted); }
    .login input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: white;
      border-radius: 12px;
      padding: 15px;
      margin: 18px 0 12px;
    }
    .primary {
      background: var(--accent);
      color: #071711;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-weight: bold;
      width: 100%;
    }
    .error { color: #ff9191; font-size: 13px; }
    .actions { display: flex; gap: 12px; align-items: center; }
    .small-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">THESIS <span>AI</span></div>
  <div class="actions">
    <div class="status">PRIVATE</div>
    <button class="small-btn" id="newChat">Chat mới</button>
    <button class="small-btn" id="lockBtn">Khóa</button>
  </div>
</header>

<main>
  <section id="messages">
    <div class="welcome" id="welcome">
      <div class="symbol">✦</div>
      <h1>THESIS AI</h1>
      <p>Private Investment Intelligence</p>
      <p>Phân tích doanh nghiệp, chứng khoán,<br>crypto và quản trị rủi ro.</p>
    </div>
  </section>

  <form class="composer" id="chatForm">
    <textarea id="prompt" rows="1"
      placeholder="Hỏi THESIS AI..."
      required></textarea>
    <button class="send" id="sendBtn" type="submit">↑</button>
  </form>
</main>

<div class="overlay" id="loginOverlay">
  <div class="login">
    <div style="font-size:40px;color:#76f1c1">✦</div>
    <h2>THESIS AI</h2>
    <p>Trợ lý nghiên cứu đầu tư cá nhân</p>
    <form id="loginForm">
      <input id="tokenInput" type="password"
        placeholder="Nhập mã truy cập" required
        autocomplete="off">
      <button class="primary" type="submit">
        Mở THESIS AI
      </button>
    </form>
    <p class="error" id="loginError"></p>
    <p style="font-size:12px">Private • Secured API</p>
  </div>
</div>

<script>
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  const form = document.getElementById("chatForm");
  const promptInput = document.getElementById("prompt");
  const sendBtn = document.getElementById("sendBtn");
  const overlay = document.getElementById("loginOverlay");
  const loginError = document.getElementById("loginError");

  let token = sessionStorage.getItem("thesis_token") || "";
  let history = [];
  let busy = false;

  if (token) overlay.style.display = "none";

  function addMessage(text, role) {
    if (welcome) welcome.style.display = "none";
    const element = document.createElement("div");
    element.className = "message " + role;
    element.textContent = text;
    messages.appendChild(element);
    messages.scrollTop = messages.scrollHeight;
    return element;
  }

  document.getElementById("loginForm")
    .addEventListener("submit", function(event) {
      event.preventDefault();
      token = document.getElementById("tokenInput").value.trim();
      if (!token) return;
      sessionStorage.setItem("thesis_token", token);
      document.getElementById("tokenInput").value = "";
      loginError.textContent = "";
      overlay.style.display = "none";
      promptInput.focus();
    });

  document.getElementById("lockBtn")
    .addEventListener("click", function() {
      token = "";
      sessionStorage.removeItem("thesis_token");
      overlay.style.display = "flex";
    });

  document.getElementById("newChat")
    .addEventListener("click", function() {
      history = [];
      messages.replaceChildren();
      const w = document.createElement("div");
      w.className = "welcome";
      w.innerHTML = "<h1>THESIS AI</h1><p>Cuộc trò chuyện mới</p>";
      messages.appendChild(w);
    });

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const text = promptInput.value.trim();
    if (!text || busy || !token) return;

    busy = true;
    sendBtn.disabled = true;
    addMessage(text, "user");
    promptInput.value = "";

    const thinking = addMessage("THESIS AI đang phân tích...", "assistant");

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-thesis-token": token
        },
        body: JSON.stringify({
          message: text,
          history: history
        })
      });

      if (response.status === 401) {
        token = "";
        sessionStorage.removeItem("thesis_token");
        overlay.style.display = "flex";
        throw new Error("Mã truy cập không chính xác. Hãy nhập lại.");
      }

      if (!response.ok) {
        throw new Error("Máy chủ trả lỗi " + response.status);
      }

      const data = await response.json();
      const reply = data.reply || "Không nhận được nội dung.";

      thinking.textContent = reply;

      history.push({ role: "user", text: text });
      history.push({ role: "model", text: reply });
      history = history.slice(-16);

    } catch (error) {
      thinking.textContent = "Lỗi: " + error.message;
    } finally {
      busy = false;
      sendBtn.disabled = false;
      promptInput.focus();
    }
  });

  promptInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
